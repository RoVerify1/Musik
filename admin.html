<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — CutStudio</title>
<style>
:root{--bg:#0a0a0f;--panel:#111114;--surface:#18181b;--border:#27272a;--text:#fafafa;--dim:#a1a1aa;--accent:#8b5cf6;--red:#ef4444;--green:#10b981}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}
h1{margin-bottom:20px;color:var(--accent)}
.btn{padding:8px 14px;border-radius:6px;border:none;cursor:pointer;font-weight:600;font-size:13px;margin:2px}
.btn-primary{background:var(--accent);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-out{background:var(--surface);color:var(--text);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px;overflow:hidden;margin-top:15px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--surface);color:var(--dim);font-size:12px;text-transform:uppercase}
.badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700}
.badge.anfaenger{background:rgba(16,185,129,.2);color:var(--green)}
.badge.mittel{background:rgba(245,158,11,.2);color:#f59e0b}
.badge.pro{background:rgba(139,92,246,.2);color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-box{background:var(--panel);padding:20px;border-radius:10px;width:350px;max-width:90%}
input,select{width:100%;padding:8px;margin:8px 0 12px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);padding:12px;border-radius:8px;text-align:center}
.stat .num{font-size:24px;font-weight:700;color:var(--accent)}
</style>
</head>
<body>
  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h1>🔐 Admin Panel</h1>
      <div>
        <button class="btn btn-out" onclick="location.href='index.html'">← Home</button>
        <button class="btn btn-danger" onclick="logout()">Abmelden</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <button class="btn btn-primary" onclick="openModal()">+ Nutzer hinzufügen</button>
    <table id="userTable"><thead><tr><th>Name</th><th>Plan</th><th>Aktion</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h3 id="modalTitle">Nutzer hinzufügen</h3>
      <input type="text" id="mUser" placeholder="Benutzername">
      <input type="password" id="mPass" placeholder="Passwort">
      <select id="mPlan">
        <option value="anfaenger">Anfänger 🌱</option>
        <option value="mittel">Mittel ⚡</option>
        <option value="pro">Pro 👑</option>
      </select>
      <button class="btn btn-primary" style="width:100%" onclick="saveUser()">Speichern</button>
      <button class="btn btn-out" style="width:100%;margin-top:8px" onclick="closeModal()">Abbrechen</button>
      <div id="mErr" style="color:var(--red);font-size:12px;margin-top:8px;display:none"></div>
    </div>
  </div>

  <script>
    const PASS = "16022011!";
    const KEY = "cs_admin_auth";
    let editUser = null;

    // Schneller Check
    if(localStorage.getItem(KEY) !== PASS){
      const p = prompt("🔐 Admin Passwort:");
      if(p === PASS) localStorage.setItem(KEY, PASS);
      else { alert("Falsch!"); location.href = "index.html"; }
    }

    function load(){
      const tb = document.querySelector("#userTable tbody");
      tb.innerHTML = "";
      let t=0,b=0,m=0,p=0;
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k.startsWith("cs_pass_")){
          const u = k.replace("cs_pass_","");
          const plan = localStorage.getItem("cs_plan_"+u)||"anfaenger";
          t++; if(plan=="anfaenger")b++; else if(plan=="mittel")m++; else p++;
          const tr = document.createElement("tr");
          tr.innerHTML = `<td><strong>${u}</strong></td><td><span class="badge ${plan}">${plan}</span></td>
            <td><button class="btn btn-out" onclick="edit('${u}')">✏️</button> <button class="btn btn-danger" onclick="del('${u}')">🗑️</button></td>`;
          tb.appendChild(tr);
        }
      }
      if(t===0) tb.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--dim)">Keine Nutzer</td></tr>';
      document.getElementById("stats").innerHTML = `
        <div class="stat"><div class="num">${t}</div>Gesamt</div>
        <div class="stat"><div class="num">${b}</div>Anfänger</div>
        <div class="stat"><div class="num">${m}</div>Mittel</div>
        <div class="stat"><div class="num">${p}</div>Pro</div>`;
    }

    function openModal(u=null){
      editUser = u;
      document.getElementById("modalTitle").textContent = u ? "Bearbeiten" : "Hinzufügen";
      document.getElementById("mUser").value = u || "";
      document.getElementById("mUser").disabled = !!u;
      document.getElementById("mPass").value = u ? localStorage.getItem("cs_pass_"+u) : "";
      document.getElementById("mPlan").value = u ? localStorage.getItem("cs_plan_"+u) : "anfaenger";
      document.getElementById("mErr").style.display = "none";
      document.getElementById("modal").classList.add("active");
    }
    function closeModal(){document.getElementById("modal").classList.remove("active");editUser=null;}

    function saveUser(){
      const u = document.getElementById("mUser").value.trim();
      const p = document.getElementById("mPass").value;
      const plan = document.getElementById("mPlan").value;
      const err = document.getElementById("mErr");
      if(u.length<3) return showErr("Mind. 3 Zeichen");
      if(!p && !editUser) return showErr("Passwort nötig");
      if(!editUser && localStorage.getItem("cs_pass_"+u)) return showErr("Name vergeben");
      localStorage.setItem("cs_pass_"+u, p);
      localStorage.setItem("cs_plan_"+u, plan);
      closeModal(); load();
    }
    function showErr(m){const e=document.getElementById("mErr");e.textContent=m;e.style.display="block";}

    function edit(u){openModal(u);}
    function del(u){if(confirm(u+" wirklich löschen?")){localStorage.removeItem("cs_pass_"+u);localStorage.removeItem("cs_plan_"+u);load();}}
    function logout(){localStorage.removeItem(KEY);location.href="index.html";}

    load();
  </script>
</body>
</html>
